[project]
name = "visionlayer-edge-api"
version = "0.1.0"
description = "VisionLayer Edge API modular monolith"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "pyyaml>=6.0.2",
  "jsonschema>=4.23.0",
  "bcrypt>=4.2.0",
  "PyJWT>=2.9.0",
  "email-validator>=2.2.0",
  "python-multipart>=0.0.12",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.10.0",
  "imageio-ffmpeg>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "B008",  # FastAPI Depends() in defaults is idiomatic
  "SIM102",  # nested ifs sometimes clearer with await
]
